name: SPT Release Build - Bento

# Builds SPT 4.1.x (and later). This workflow delegates the entire clone, build, assemble, package pipeline to Bento,
# run from its prebuilt container image. Bento clones all three repos at the tag, builds server (win+linux), launcher
# (win+linux), and modules, overlays its static assets, and writes the .7z archive, manifest.json, and NuGet packages to
# the output directory. This workflow guards the version, pushes the NuGet packages, and handles distribution by reading
# Bento's output.

on:
  workflow_dispatch:
    inputs:
      buildTag:
        description: "The tag to build on"
        required: true
        type: string

concurrency:
  # Per-tag, and never cancelled: publishing writes two hosts independently, so a build killed part-way through can
  # leave patcher and mirror serving different release.json files.
  group: spt-release-build-bento-${{ github.event.inputs.buildTag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # The image produced by Bento's release.yml.
      image: ghcr.io/sp-tushonka/bento:latest
    steps:
      - name: Determine Build Context
        id: determine-context
        shell: bash
        run: |
          echo "Determining build context..."

          TAG_NAME="${{ github.event.inputs.buildTag }}"
          if [[ -z "$TAG_NAME" ]]; then
            echo "No build tag provided."
            exit 1
          fi

          echo "target_tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Target tag is $TAG_NAME"

      - name: Guard SPT Version
        id: guard
        shell: bash
        env:
          TARGET_TAG: ${{ steps.determine-context.outputs.target_tag }}
        run: |
          # Derive the SPT version the same way Bento does: strip a leading v/V, then take the prefix up to the first
          # dash (drops -BE / -BEM / date suffixes).
          VERSION="${TARGET_TAG#[vV]}"
          VERSION="${VERSION%%-*}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not parse a semver SPT version from tag '$TARGET_TAG'."
            exit 1
          fi

          # Base-10 to avoid octal interpretation of any zero-padded segment.
          MAJOR=$((10#${VERSION%%.*}))
          REST="${VERSION#*.}"
          MINOR=$((10#${REST%%.*}))

          # This workflow builds SPT 4.1.x and later. Reject everything else.
          if (( MAJOR < 4 )); then
            echo "::error::SPT $VERSION (3.x) is no longer built by this repository."
            exit 1
          fi
          if (( MAJOR == 4 && MINOR < 1 )); then
            echo "::error::SPT $VERSION is a 4.0.x build. Build it with build-4.0.yaml."
            exit 1
          fi

          echo "Accepted SPT version $VERSION (4.1+)."

      - name: Build with Bento
        id: bento
        shell: bash
        env:
          MODULE_PACKAGE: ${{ secrets.MODULE_DOMAIN }}
        run: |
          OUTPUT_DIR="$GITHUB_WORKSPACE/dist"
          rm -rf "$OUTPUT_DIR"

          # Use the `--fresh` option to clone server-csharp, modules, and launcher at the tag and build them. Version
          # and build type are derived from the tag. Using the `--no-config` option keeps it fully-flagged.
          /opt/bento/bento \
            --fresh \
            --tag "${{ steps.determine-context.outputs.target_tag }}" \
            --output "$OUTPUT_DIR" \
            --no-config

          echo "output_dir=$OUTPUT_DIR" >> $GITHUB_OUTPUT

      - name: Read Build Manifest
        id: manifest
        shell: bash
        run: |
          MANIFEST="${{ steps.bento.outputs.output_dir }}/manifest.json"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "::error::manifest.json not found at $MANIFEST"
            exit 1
          fi

          echo "Build manifest:"
          cat "$MANIFEST"
          echo ""

          ARCHIVE_NAME=$(jq -r '.archive.name' "$MANIFEST")

          {
            echo "build_type=$(jq -r '.buildType' "$MANIFEST")"
            echo "spt_version=$(jq -r '.sptVersion' "$MANIFEST")"
            echo "client_version=$(jq -r '.clientVersion' "$MANIFEST")"
            echo "nuget_version=$(jq -r '.nuget.version' "$MANIFEST")"
            echo "build_name=$ARCHIVE_NAME"
            echo "base_name=${ARCHIVE_NAME%.7z}"
            echo "file_size_mb=$(jq -r '.archive.sizeDisplay' "$MANIFEST")"
            echo "file_hash=$(jq -r '.archive.md5Base64' "$MANIFEST")"
            echo "channel=$(jq -r '.release.channel' "$MANIFEST")"
            echo "runtime_folder=$(jq -r '.release.runtimeFolderName' "$MANIFEST")"
          } >> $GITHUB_OUTPUT

      - name: NuGet Login
        id: nuget-login
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet Packages
        continue-on-error: true
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NuGet login produced no key; nothing was published. Check the trusted publishing policy on nuget.org covers ${{ github.repository }} / $(basename "$GITHUB_WORKFLOW_REF" | cut -d@ -f1)."
            echo "NuGet: login failed, no packages published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Bento packs the server libraries but never pushes them. Publish only the packages Bento curated in the
          # manifest, not every .nupkg in the directory.
          MANIFEST="${{ steps.bento.outputs.output_dir }}/manifest.json"
          PKG_DIR="${{ steps.bento.outputs.output_dir }}/packages"
          VERSION="${{ steps.manifest.outputs.nuget_version }}"

          if [ ! -f "$MANIFEST" ]; then
            echo "No manifest at $MANIFEST, skipping NuGet publish."
            exit 0
          fi

          mapfile -t PACKAGES < <(jq -r '.nuget.packages[]' "$MANIFEST")
          if [ ${#PACKAGES[@]} -eq 0 ]; then
            echo "Manifest lists no packages, skipping NuGet publish."
            exit 0
          fi

          FAILED=()
          for PACKAGE in "${PACKAGES[@]}"; do
            PACKAGE_FILE="$PKG_DIR/${PACKAGE}.${VERSION}.nupkg"
            if [ -f "$PACKAGE_FILE" ]; then
              echo "Publishing ${PACKAGE}.${VERSION}.nupkg..."
              if dotnet nuget push "$PACKAGE_FILE" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate; then
                echo "Successfully published $PACKAGE"
              else
                echo "::error::Failed to publish ${PACKAGE}.${VERSION}."
                FAILED+=("$PACKAGE")
              fi
            else
              echo "::error::${PACKAGE}.${VERSION}.nupkg was listed in the manifest but not produced."
              FAILED+=("$PACKAGE")
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "NuGet: ${#FAILED[@]} of ${#PACKAGES[@]} packages failed to publish (${FAILED[*]})." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NuGet: published ${#PACKAGES[@]} packages at ${VERSION}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Release Manifest
        # Merges this build into the live release.json rather than replacing it. The installer keys one entry per
        # major.minor channel, so publishing 4.1.3 must replace the "4.1" entry and leave every other channel alone.
        if: steps.manifest.outputs.build_type == 'RELEASE'
        id: release-json
        working-directory: ${{ steps.bento.outputs.output_dir }}
        env:
          CHANNEL: ${{ steps.manifest.outputs.channel }}
          CLIENT_VERSION: ${{ steps.manifest.outputs.client_version }}
          RUNTIME_FOLDER: ${{ steps.manifest.outputs.runtime_folder }}
          FILE_HASH: ${{ steps.manifest.outputs.file_hash }}
          BUILD_NAME: ${{ steps.manifest.outputs.build_name }}
          PRIMARY_BASE: ${{ secrets.RELEASE_PRIMARY_BASE }}
          MIRROR_BASE: ${{ secrets.RELEASE_MIRROR_BASE }}
        shell: bash
        run: |
          set -euo pipefail

          # Read the live file before touching anything. Publishing a fresh single-entry file would silently drop
          # every other channel, so a fetch failure has to stop the release rather than fall back to an empty list.
          if ! curl -fsSL --retry 3 "${PRIMARY_BASE}/release.json" -o current.json; then
            echo "::warning::Could not read release.json from the primary host, trying the mirror."
            if ! curl -fsSL --retry 3 "${MIRROR_BASE}/release.json" -o current.json; then
              echo "::error::Could not read the live release.json from either host. Refusing to publish, as writing a new file here would drop the other release channels."
              exit 1
            fi
          fi

          if ! jq -e '.Releases | type == "array"' current.json > /dev/null; then
            echo "::error::The live release.json has no Releases array. Refusing to publish."
            exit 1
          fi

          BEFORE=$(jq '.Releases | length' current.json)
          echo "Live release.json holds $BEFORE channel(s): $(jq -r '[.Releases[].SPTVersion] | join(", ")' current.json)"

          MIRRORS=$(jq -n \
            --arg main "${PRIMARY_BASE}/releases/${BUILD_NAME}" \
            --arg mirror "${MIRROR_BASE}/releases/${BUILD_NAME}" \
            --arg hash "$FILE_HASH" \
            '[{Name: "Main", DownloadUrl: $main, Hash: $hash}, {Name: "Mirror", DownloadUrl: $mirror, Hash: $hash}]')

          # RequiredRuntimes is curated policy that changes without a rebuild, so it carries over from the channel's
          # existing entry instead of being restated here.
          jq \
            --arg channel "$CHANNEL" \
            --arg clientVersion "$CLIENT_VERSION" \
            --arg runtimeFolder "$RUNTIME_FOLDER" \
            --argjson mirrors "$MIRRORS" \
            '
            .Releases as $releases
            | ($releases | map(select(.SPTVersion == $channel)) | first) as $existing
            | {
                SPTVersion: $channel,
                ClientVersion: $clientVersion,
                RuntimeFolderName: $runtimeFolder,
                RequiredRuntimes: ($existing.RequiredRuntimes // []),
                Mirrors: $mirrors
              } as $entry
            | {
                Releases: (
                  if $existing
                  then ($releases | map(if .SPTVersion == $channel then $entry else . end))
                  else ([$entry] + $releases)
                  end
                )
              }
            ' current.json > release.json

          if [ "$(jq '.Releases | length' release.json)" -lt "$BEFORE" ]; then
            echo "::error::The merge lost a release channel. Refusing to publish."
            exit 1
          fi

          if [ "$(jq --arg c "$CHANNEL" '.Releases[] | select(.SPTVersion == $c) | .RequiredRuntimes | length' release.json)" -eq 0 ]; then
            echo "::error::Channel ${CHANNEL} has no RequiredRuntimes. A new channel needs its runtime requirements seeded in the live release.json before the first automated publish."
            exit 1
          fi

          echo "Merged release.json:"
          cat release.json

      - name: Publish Release to Mirrors
        # NOTE: This step is LIVE for release builds. Bento's manifest reports the build type in all-caps, so a plain
        # semver tag produces 'RELEASE' and runs this step, WHICH PUSHES THE NEW BUILD TO THE LIVE INSTALLER. Bleeding
        # edge and debug builds never match and are unaffected.
        #
        # Both hosts are written independently, archives first, so release.json never points at a file that is not
        # there yet. Stale archives for this channel are pruned last, once the new entry is live.
        if: steps.manifest.outputs.build_type == 'RELEASE'
        working-directory: ${{ steps.bento.outputs.output_dir }}
        env:
          CHANNEL: ${{ steps.manifest.outputs.channel }}
          BUILD_NAME: ${{ steps.manifest.outputs.build_name }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_RELEASE_PATH: ${{ secrets.SFTP_RELEASE_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          echo '[r2]
          type = s3
          provider = Cloudflare
          access_key_id = '"$R2_ACCESS_KEY"'
          secret_access_key = '"$R2_SECRET_ACCESS_KEY"'
          region = auto
          endpoint = '"$R2_ENDPOINT"'
          acl = public-read' > ./rclone.conf

          ssh_opts=(-o "Port=${SFTP_PORT}" -o "ConnectTimeout=20" -o "StrictHostKeyChecking=no")

          echo "== Uploading archive to R2 =="
          rclone copy "./${BUILD_NAME}" "r2:${R2_BUCKET_NAME}/releases/" --config ./rclone.conf -vv

          echo "== Uploading archive to the VPS mirror =="
          sshpass -p "$SFTP_PASSWORD" scp "${ssh_opts[@]}" "./${BUILD_NAME}" \
            "${SFTP_USERNAME}@${SFTP_HOST}:${SFTP_RELEASE_PATH}/releases/"

          echo "== Publishing release.json to both hosts =="
          rclone copy "./release.json" "r2:${R2_BUCKET_NAME}/" --config ./rclone.conf -vv
          sshpass -p "$SFTP_PASSWORD" scp "${ssh_opts[@]}" "./release.json" \
            "${SFTP_USERNAME}@${SFTP_HOST}:${SFTP_RELEASE_PATH}/release.json"

          echo "== Pruning superseded ${CHANNEL} archives =="
          rclone lsf "r2:${R2_BUCKET_NAME}/releases/" --config ./rclone.conf --files-only --include "SPT-${CHANNEL}.*.7z" \
            | grep -vFx "${BUILD_NAME}" > stale.txt || true
          if [ -s stale.txt ]; then
            echo "Removing from R2:"
            cat stale.txt
            rclone delete "r2:${R2_BUCKET_NAME}/releases/" --config ./rclone.conf --files-from=stale.txt --max-depth 1 -vv
          else
            echo "Nothing stale in R2."
          fi

          sshpass -p "$SFTP_PASSWORD" ssh "${ssh_opts[@]}" "${SFTP_USERNAME}@${SFTP_HOST}" \
            "find '${SFTP_RELEASE_PATH}/releases' -maxdepth 1 -name 'SPT-${CHANNEL}.*.7z' ! -name '${BUILD_NAME}' -print -delete"

          echo "Release published to both hosts."

      - name: Upload Release to HTTPS Source
        id: upload-https-7z
        working-directory: ${{ steps.bento.outputs.output_dir }}
        shell: bash
        run: |
          sshpass -p "${{ secrets.SFTP_PASSWORD }}" scp -v -o "Port=${{ secrets.SFTP_PORT }}" -o "ConnectTimeout=20" -o "StrictHostKeyChecking=no" "${{ steps.manifest.outputs.build_name }}" ${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_HOST }}:/public/builds
          echo "link_https=${{ secrets.SFTP_MIRROR_LINK }}/builds/${{ steps.manifest.outputs.build_name }}" >> $GITHUB_OUTPUT
          echo "HTTPS Upload completed: ${{ secrets.SFTP_MIRROR_LINK }}/builds/${{ steps.manifest.outputs.build_name }}"

      - name: Post Build Info to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_SHARP_URL }}
          BUILD_TYPE: ${{ steps.manifest.outputs.build_type }}
          BASE_NAME: ${{ steps.manifest.outputs.base_name }}
          BUILD_NAME: ${{ steps.manifest.outputs.build_name }}
          FILE_SIZE_MB: ${{ steps.manifest.outputs.file_size_mb }}
          FILE_HASH: ${{ steps.manifest.outputs.file_hash }}
          LINK_HTTPS: ${{ steps.upload-https-7z.outputs.link_https }}
        shell: bash
        run: |
          UPPER_BUILD_TYPE=$(echo "$BUILD_TYPE" | tr '[:lower:]' '[:upper:]')
          FOOTER_MESSAGES=("MadByte asks: is this compatable on Linux?" "You look great today!" "Powered by coffee" "Life's too short to remove USB safely" "Have you tried turning it off and on again?" "In Chomp we trust" "Beep boop, I'm a bot - Waffle" "Keep calm and commit your code" "This isn't a bug, it's an undocumented feature" "Please direct all support requests to Drakia" "Meaw" "If this doesnt work it's because of Alex" "Chomp approves of this message" "Chomp is life, Chomp is love" "Drakia denies all involvement" "Drakia left this note here just to confuse you" "CWX is the reason we can't have nice things" "CWX voted against this message" "Powered by caffeine, chaos, and Chomp" "RaiRai says hi-hi" "RaiRai wants to remind you that sarcasm is a skill" "Refringe just wobbled" "Refringe is watching" "Refringe rewrote this embed thirty times" "Refringe, professional button-pusher extraordinaire" "Sarix would like you to reconsider your choices" "Sarix just gave this embed a 7/10" "Waffle has entered the chat, and now it's weird" "Waffle is busy stacking layers of chaos" "Waffle would like to speak to the manager of logic" "Have you tried our new FAFO bot?" "Say NO to Docker" "Careful, Arch just made something async" "ERR ChatGPT 4 Credits Expired" "We should rename General chat to off-topic" "I'm an advanced AI that cost several billion dollars to train and they have me building test releases" "uwu" "big if true")
          FOOTER_MESSAGE="${FOOTER_MESSAGES[$RANDOM % ${#FOOTER_MESSAGES[@]}]}"
          TIMESTAMP=$(date --iso-8601=seconds)
          MODS=""

          if [ "$BUILD_TYPE" == "BLEEDINGEDGE" ]; then
            EMBED_COLOR=15548997
            EMBED_DESCRIPTION='A new bleeding edge build is available. These are strictly for testing issues *and not for general gameplay*. 7-Zip is *required* to extract the release. The download link is temporary.'
            MODS='disabled'
          elif [ "$BUILD_TYPE" == "BLEEDINGEDGEMODS" ]; then
            EMBED_COLOR=15548997
            EMBED_DESCRIPTION='A new bleeding edge build is available. These are strictly for testing issues *and not for general gameplay*. 7-Zip is *required* to extract the release. The download link is temporary.'
            MODS='enabled'
          elif [ "$BUILD_TYPE" == "DEBUG" ]; then
            EMBED_COLOR=2123412
            EMBED_DESCRIPTION=$'A new debug build is available. These have extra-verbose logging enabled *for testing*. 7-Zip is *required* to extract the release. The download link is temporary.'
            MODS='enabled'
          else
            EMBED_COLOR=5763719
            EMBED_DESCRIPTION=$'A new *release* build has been published. Get to testing, nerds.'
            MODS='enabled'
          fi

          fields_json='[
            {"name": "Name", "value": "'"$BASE_NAME"'"},
            {"name": "Build Type", "value": "'"$BUILD_TYPE"'", "inline": true},
            {"name": "Mods", "value": "'"$MODS"'", "inline": true},
            {"name": "File Size", "value": "'"$FILE_SIZE_MB"'", "inline": true},
            {"name": "File Hash", "value": "'"$FILE_HASH"'"},
            {"name": "Download", "value": "'"$LINK_HTTPS"'"}
          ]'

          payload=$(jq -n \
            --argjson fields "$fields_json" \
            --arg EMBED_DESCRIPTION "$EMBED_DESCRIPTION" \
            --argjson EMBED_COLOR "$EMBED_COLOR" \
            --arg FOOTER_MESSAGE "$FOOTER_MESSAGE" \
            --arg TIMESTAMP "$TIMESTAMP" \
            '{
              "content": $EMBED_DESCRIPTION,
              "embeds": [
                {
                  "title": "Build Information",
                  "color": $EMBED_COLOR,
                  "fields": $fields,
                  "footer": {"text": $FOOTER_MESSAGE, "icon_url": "https://i.imgur.com/28JJJec.png"},
                  "timestamp": $TIMESTAMP
                }
              ],
              "username": "BuildBot",
              "avatar_url": "https://i.imgur.com/28JJJec.png"
            }')
          echo "$payload" > payload_discord.json

          echo "Payload Generated:"
          cat payload_discord.json

          echo "Sending Payload..."
          curl -H "Content-Type: application/json" \
            -X POST \
            --data-binary @payload_discord.json \
            $DISCORD_WEBHOOK_URL
